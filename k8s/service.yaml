apiVersion: v1
kind: Service
metadata:
  name: quickbite-backend-service
spec:
  type: NodePort
  selector:
    app: quickbite-backend
  ports:
    - port: 3001
      targetPort: 3001
      nodePort: 30001
---
apiVersion: v1
kind: Service
metadata:
  name: quickbite-frontend-service
spec:
  type: NodePort
  selector:
    app: quickbite-frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30000